name: Build Windows portable ZIP

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Check code quality
        run: pnpm lint

      - name: Build Windows portable ZIP
        run: pnpm desktop:make:win

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TMX-Local-Workbench-windows-x64
          path: release/make/zip/win32/x64/*.zip
          if-no-files-found: error
          retention-days: 30
