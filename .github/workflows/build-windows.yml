name: Build Windows portable ZIP

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code quality
        run: pnpm lint

      - name: Build Windows portable ZIP
        run: pnpm desktop:make:win

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TMX-Forge-windows-x64
          path: release/make/zip/win32/x64/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Get-ChildItem "release/make/zip/win32/x64/*.zip" | Select-Object -First 1
          if (-not $asset) {
            throw "Windows portable ZIP was not found."
          }
          gh release create $env:GITHUB_REF_NAME $asset.FullName `
            --verify-tag `
            --title "TMX Forge $env:GITHUB_REF_NAME" `
            --generate-notes
